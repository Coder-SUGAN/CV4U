<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2027" />
      <stop offset="50%" stop-color="#203A43" />
      <stop offset="100%" stop-color="#2C5364" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="50%" stop-color="#4364F7" />
      <stop offset="100%" stop-color="#6FB1FC" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A2540" />
      <stop offset="60%" stop-color="#0066FF" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Logo Group -->
  <g transform="translate(10, 10)">
    <!-- Main Typography: CV4U -->
    <text x="10" y="95" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="88" fill="url(#textGrad)" letter-spacing="-3">
      CV<tspan fill="#0066FF">4</tspan>U
    </text>

    <!-- Document Badge Icon -->
    <g transform="translate(325, 12)" filter="url(#shadow)">
      <!-- Base Card -->
      <path d="M 0 12 C 0 5.37, 5.37 0, 12 0 L 60 0 L 80 20 L 80 84 C 80 90.63, 74.63 96, 68 96 L 12 96 C 5.37 96, 0 90.63, 0 84 Z" fill="url(#accentGrad)" />
      <!-- Folded Corner -->
      <path d="M 60 0 L 80 20 L 64 20 C 61.79 20, 60 18.21, 60 16 Z" fill="#0A2540" opacity="0.4" />
      
      <!-- Inner White Page -->
      <rect x="8" y="10" width="64" height="76" rx="6" fill="#FFFFFF" />
      
      <!-- User Avatar Circle inside badge -->
      <circle cx="28" cy="26" r="8" fill="#0052D4" />
      <path d="M 18 42 C 18 36, 22 34, 28 34 C 34 34, 38 36, 38 42" fill="#0052D4" />

      <!-- Document Content Lines -->
      <rect x="42" y="22" width="22" height="4" rx="2" fill="#0052D4" opacity="0.8" />
      <rect x="42" y="30" width="18" height="4" rx="2" fill="#0052D4" opacity="0.5" />
      
      <rect x="18" y="50" width="46" height="4" rx="2" fill="#0052D4" opacity="0.7" />
      <rect x="18" y="58" width="38" height="4" rx="2" fill="#0052D4" opacity="0.5" />
      <rect x="18" y="66" width="42" height="4" rx="2" fill="#0052D4" opacity="0.6" />
    </g>

    <!-- Subtitle Line & Text -->
    <line x1="10" y1="125" x2="50" y2="125" stroke="#0066FF" stroke-width="3" stroke-linecap="round" />
    <text x="62" y="130" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="800" font-size="13" fill="#0A2540" letter-spacing="2.5">
      YOUR CV, YOUR FUTURE
    </text>
    <line x1="355" y1="125" x2="415" y2="125" stroke="#0066FF" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
